name: Publicar versión portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Versión sin v (vacío usa Directory.Build.props)
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Crear ZIP portable y Release
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-windows-lock.txt

      - name: Preparar .NET 10 LTS
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Instalar dependencias verificadas
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-lock.txt'

      - name: Determinar versión
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = [string]$properties.Project.PropertyGroup.ExportaGarminVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versión no válida.' }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -cne $version) {
            throw 'La versión solicitada no coincide con el código.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'La etiqueta no coincide con la versión del código.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Construir y validar la descarga
        shell: pwsh
        run: ./scripts/Build-PortableRelease.ps1 -BuilderPython (Get-Command python).Source

      - name: Publicar los archivos de la versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $zip = "artifacts/ExportaGarmin-$version-Windows-x64.zip"
          $hash = "$zip.sha256"
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Faltan las notas revisadas de esta versión.' }
          gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw 'La Release ya existe. No se sustituirán sus archivos automáticamente.'
          }
          gh release create $tag $zip $hash --repo $env:GH_REPO `
            --target $env:GITHUB_SHA --title "ExportaGarmin $version" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la Release.' }

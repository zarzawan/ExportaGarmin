name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Pruebas y compilación
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-windows-lock.txt

      - name: Preparar .NET 10 LTS
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Instalar dependencias Python
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-lock.txt

      - name: Validar backend, lanzador y contratos compartidos
        shell: pwsh
        run: ./scripts/Validate-Project.ps1 -PythonPath (Get-Command python).Source
